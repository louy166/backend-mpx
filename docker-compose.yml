version: "3.9"

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: mpx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: foncier_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mpx_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foncier_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: mpx-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: foncier_api
      DB_USERNAME: postgres
      DB_PASSWORD: mpx_secret_2026
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      SEED_ENABLED: "true"
      OTP_DEV_MODE: "true"
      OTP_DEV_CODE: "123456"
      JWT_SECRET: mpx-test-secret-key-minimum-32-chars-hmac-sha256
      PUBLIC_BASE_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: "http://localhost:*,http://127.0.0.1:*,exp://*"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
