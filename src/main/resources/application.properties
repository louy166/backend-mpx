spring.application.name=foncier-api
server.port=${SERVER_PORT:8080}

# Import automatique du fichier .env à la racine du projet (optionnel en CI/Prod)
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# PostgreSQL Database Configuration
# Base de données basée sur le package mr.foncier_api (foncier_api)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foncier_api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1200000}

# ===================================================================
# JPA / Hibernate Configuration (PostgreSQL 16+ & PostGIS 3.4+)
# ===================================================================
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=false
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Spring Session JDBC Configuration
# ===================================================================
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION

# ===================================================================
# Contrat API Frontend (JSON snake_case, Multipart 10MB, ISO-8601)
# ===================================================================
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:50MB}

# ===================================================================
# CORS (Origines autorisées séparées par des virgules)
# ===================================================================
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.fonciermauritanie.mr,https://fonciermauritanie.mr}

# ===================================================================
# Stockage local des fichiers téléversés (Photos profil, KYC, Biens)
# ===================================================================
app.storage.upload-dir=${UPLOAD_DIR:uploads}
app.storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# ===================================================================
# Tarification unitaire hors abonnement (Contrat API §8)
# ===================================================================
app.unlock.unit-price-mru=${UNLOCK_UNIT_PRICE_MRU:500}

# ===================================================================
# Documentation OpenAPI 3.1 / Swagger UI (Contrat API Checklist #14)
# ===================================================================
springdoc.api-docs.path=${OPENAPI_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/api/docs}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# Seed de démonstration (Checklist #15 : biens, mandat & mission démo)
# ===================================================================
app.seed.enabled=${SEED_ENABLED:true}

# ===================================================================
# Sécurité JWT & Authentification OTP (Contrat API §2 & Checklist #10)
# ===================================================================
app.jwt.secret=${JWT_SECRET:mpx-foncier-mauritanie-secret-key-2026-hmac-sha256-min-256-bits-secure}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXP_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXP_MS:2592000000}
app.otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:300}
app.otp.max-requests-per-minute=${OTP_MAX_REQUESTS_PER_MINUTE:3}
app.otp.dev-mode=${OTP_DEV_MODE:true}
app.otp.dev-code=${OTP_DEV_CODE:123456}

# ===================================================================
# Logging Configuration (Package de base: mr.foncier_api)
# ===================================================================
logging.level.mr.foncier_api=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_SQL_BIND:TRACE}
